# 實驗 B2-B5 / D1/D2:TRM + Gradient Checkpointing
name: recursive_reasoning.trm_gc@TRM_GC
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6   # n,由命令列覆蓋(如 arch.L_cycles=16)

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: rope
forward_dtype: bfloat16

mlp_t: True
puzzle_emb_len: 16
no_ACT_continue: True

gc_segments: 0   # 0 = 自動 √n 段
