# 實驗 B6 / D3/D4:SRM + Gradient Checkpointing
name: recursive_reasoning.trm_singlez_gc@SRM_GC
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: rope
forward_dtype: bfloat16

mlp_t: True
puzzle_emb_len: 16
no_ACT_continue: True

gc_segments: 0
